name: Build and Release FluxRoute

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Read version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content .\FluxRoute\FluxRoute.csproj
          $ver = $csproj.Project.PropertyGroup.Version
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "TAG=v$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version: $ver, Tag: v$ver"

      - name: Verify tag matches version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $expectedTag = "v${{ steps.version.outputs.VERSION }}"
          $actualTag = "${{ github.ref_name }}"
          if ($actualTag -ne $expectedTag) {
            Write-Error "Tag mismatch: pushed tag '$actualTag' does not match version in .csproj '$expectedTag'. Please update the version in FluxRoute.csproj before pushing the tag."
            exit 1
          }
          Write-Host "Tag '$actualTag' matches version in .csproj. OK."

      - name: Restore solution
        run: dotnet restore .\FluxRoute.slnx

      - name: Run tests
        run: dotnet test .\FluxRoute.slnx --configuration Release --no-restore

      - name: Publish win-x64
        run: dotnet publish .\FluxRoute\FluxRoute.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o .\publish

      - name: Bundle official Flowseal engine
        shell: pwsh
        run: .\installer\prepare-flowseal.ps1 -PublishDir .\publish

      - name: Build Installer
        shell: pwsh
        run: |
          $programFilesX86 = (Get-Item Env:'ProgramFiles(x86)').Value
          $isccCandidates = @(
            (Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

          if (-not $iscc) {
            choco install innosetup --no-progress --yes
            $iscc = $isccCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          }

          if (-not $iscc) {
            throw 'Inno Setup compiler (ISCC.exe) was not found.'
          }

          & $iscc "/DAppVersion=${{ steps.version.outputs.VERSION }}" .\installer\FluxRoute.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create ZIP
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          Compress-Archive -Path .\publish\* -DestinationPath ".\FluxRoute-$tag-portable.zip" -Force

      - name: Calculate SHA-256 hashes
        id: hashes
        shell: pwsh
        run: |
          $zip = ".\FluxRoute-${{ steps.version.outputs.TAG }}-portable.zip"
          $installer = ".\installer-output\FluxRoute-v${{ steps.version.outputs.VERSION }}-installer.exe"

          if (-not (Test-Path -LiteralPath $zip)) {
            throw "Portable archive was not found: $zip"
          }
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer artifact was not found: $installer"
          }

          $zipSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()

          "ZIP_SHA256=$zipSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "INSTALLER_SHA256=$installerSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Portable SHA-256: $zipSha"
          Write-Host "Installer SHA-256: $installerSha"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: FluxRoute-${{ steps.version.outputs.TAG }}
          path: |
            .\FluxRoute-${{ steps.version.outputs.TAG }}-portable.zip
            .\installer-output\FluxRoute-v${{ steps.version.outputs.VERSION }}-installer.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.version.outputs.TAG }}"
          $zip = ".\FluxRoute-$tag-portable.zip"
          $installer = ".\installer-output\FluxRoute-v${{ steps.version.outputs.VERSION }}-installer.exe"
          $zipSha = "${{ steps.hashes.outputs.ZIP_SHA256 }}"
          $installerSha = "${{ steps.hashes.outputs.INSTALLER_SHA256 }}"
          $notes = @"
          ## FluxRoute $tag

          ### Файлы
          - `$([System.IO.Path]::GetFileName($zip))` — portable-версия.
          - `$([System.IO.Path]::GetFileName($installer))` — установщик.

          ### Установка
          - Portable: распакуйте архив и запустите `FluxRoute.exe` от имени администратора.
          - Installer: запустите установщик и следуйте инструкциям.
          - Требования: Windows 10/11 x64 и права администратора.

          ### SHA-256
          - Portable: `$zipSha`
          - Installer: `$installerSha`

          Хеш можно проверить командой:
          ````powershell
          Get-FileHash -Path <файл> -Algorithm SHA256
          ````
          "@
          $notes = ($notes -replace '(?m)^          ', '').Trim()

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $installer --clobber --repo "$env:GITHUB_REPOSITORY"
          }
          else {
            gh release create $tag $zip $installer --title "$tag" --notes "$notes" --target "${{ github.ref_name }}" --repo "$env:GITHUB_REPOSITORY"
          }
